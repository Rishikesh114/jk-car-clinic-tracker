name: JK Car Clinic CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    name: 🧪 Automated Testing & Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🧪 Run Automated API & Unit Tests (Jest & Supertest)
        run: npm test

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏗️ Test Docker Image Build
        run: |
          docker build -t jk-car-clinic:latest .

  deploy-to-aws-ec2:
    name: 🚀 Deploy to AWS EC2
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔑 Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            echo "🚀 Deployment started on EC2..."
            
            # Navigate to project directory or clone if first time
            if [ ! -d "~/car-clinic-tracker" ]; then
              git clone https://github.com/${{ github.repository }}.git ~/car-clinic-tracker
            fi
            
            cd ~/car-clinic-tracker
            git fetch origin main
            git reset --hard origin/main
            
            # Rebuild and restart Docker containers
            docker compose down || true
            docker compose up -d --build
            
            echo "✅ Deployment successful! App running on AWS EC2."
